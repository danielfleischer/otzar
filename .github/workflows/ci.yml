name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (Clojure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('server/deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-
      - name: Compile-check namespaces
        run: make check-server
      - name: Run tests
        run: make test-server

  client:
    name: Client (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: client/go.sum
      - name: Build
        run: make client
      - name: Run tests
        run: make test-client
