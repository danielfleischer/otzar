name: CI

# Mirrors the local dev loop: the same `make` targets, on the same toolchain
# versions used on the author's machine (Homebrew's `clojure` + OpenJDK 26,
# Go 1.26.5). Nothing here needs Ollama — the tests that touch embeddings stub
# it out.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (Clojure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.5.1654
      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('server/deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-
      # test-server depends on check-server, so this compiles every rag.*
      # namespace before running the suite — one `make test-server`, as locally.
      - name: Compile-check and test
        run: make test-server

  client:
    name: Client (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # `make client` stamps the version from `git describe`, which needs
          # tags and history — a shallow clone would report a bare SHA.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: client/go.sum
      - name: Lint
        run: make lint
      - name: Build
        run: make client
      - name: Run tests
        run: make test-client
